<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Background Badge with Subtle Glow -->
  <rect x="5" y="6" width="48" height="48" rx="14" fill="url(#emeraldGrad)" />
  
  <!-- Shopping Basket with Leaf Icon -->
  <path d="M 17 26 L 41 26 L 38 42 C 37.8 44 36 45 34 45 L 24 45 C 22 45 20.2 44 20 42 Z" fill="#FFFFFF" />
  <path d="M 23 26 C 23 19 35 19 35 26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <!-- Radiant Gold Leaf in Basket -->
  <path d="M 29 19 C 34 16 39 19 37 25 C 34 28 28 26 29 19 Z" fill="url(#goldGrad)" />
  
  <!-- Brand Text (High-contrast for Dark Theme) -->
  <text x="64" y="32" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#F8FAFC" letter-spacing="-0.5">KUMARI</text>
  <text x="156" y="32" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#10B981" letter-spacing="-0.5">MART</text>
  
  <!-- Tagline -->
  <text x="64" y="47" font-family="'Poppins', sans-serif" font-weight="600" font-size="9.5" fill="#94A3B8" letter-spacing="1.8">LUXURY SUPERMARKET &amp; SUPPLY</text>
</svg>
